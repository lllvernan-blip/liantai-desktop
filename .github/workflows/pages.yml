# 练习台纯静态网页部署到 GitHub Pages；site/ 保留，但不再作为发布产物。
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "app/index.html"
      - "pool-pick.js"
      - "materials/pool/**"
      - "tools/build-web.mjs"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只部署一次；后来的那次不等前面跑完（站点是无状态的整份替换）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static web
        run: node tools/build-web.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
      - id: deploy
        uses: actions/deploy-pages@v4
